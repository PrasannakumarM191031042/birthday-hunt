<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Birthday Surprise</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      background: #000;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      text-align: center;

      min-height: 100vh;

    }

    h1 {

      margin:
        35px 10px 15px;

      color:
        #4cff3b;

      font-size:
        42px;

      text-shadow:
        0 0 15px
        rgba(76,255,59,0.8);

    }

    .subtitle {

      font-size:
        21px;

      margin:
        15px;

      line-height:
        1.6;

    }

    #scannerPage,
    #resultPage {

      width:
        100%;

      max-width:
        800px;

      margin:
        auto;

      padding:
        10px 20px 40px;

    }

    .cameraBox {

      width:
        100%;

      margin:
        30px auto;

      padding:
        15px;

      border:
        4px solid
        #4cff3b;

      border-radius:
        20px;

      box-shadow:
        0 0 25px
        rgba(76,255,59,0.5);

      background:
        #080808;

    }

    #camera {

      width:
        100%;

      display:
        block;

      border-radius:
        15px;

      background:
        #111;

      min-height:
        300px;

      object-fit:
        cover;

    }

    #status {

      font-size:
        20px;

      margin:
        20px;

      color:
        #ddd;

    }

    button {

      padding:
        16px 30px;

      font-size:
        19px;

      font-weight:
        bold;

      border:
        2px solid
        #4cff3b;

      border-radius:
        12px;

      background:
        #111;

      color:
        #4cff3b;

      margin:
        15px;

      box-shadow:
        0 0 12px
        rgba(76,255,59,0.4);

    }

    button:disabled {

      opacity:
        0.5;

    }

    #resultPage {

      display:
        none;

    }

    .successTitle {

      font-size:
        34px;

      color:
        #4cff3b;

      margin:
        30px 0;

      text-shadow:
        0 0 15px
        rgba(76,255,59,0.8);

    }

    .clueCard {

      margin:
        25px auto;

      padding:
        30px 25px;

      border:
        3px solid
        #4cff3b;

      border-radius:
        20px;

      background:
        #0b0b0b;

      box-shadow:
        0 0 30px
        rgba(76,255,59,0.4);

    }

    .clueLabel {

      font-size:
        16px;

      color:
        #aaa;

      text-transform:
        uppercase;

      letter-spacing:
        2px;

      margin-bottom:
        15px;

    }

    #clueText {

      font-size:
        28px;

      line-height:
        1.6;

      color:
        white;

    }

    .timerBox {

      margin:
        30px auto;

      padding:
        25px;

      border:
        2px solid
        #4cff3b;

      border-radius:
        18px;

      background:
        #090909;

      box-shadow:
        0 0 20px
        rgba(76,255,59,0.3);

    }

    .timerLabel {

      font-size:
        18px;

      color:
        #aaa;

      margin-bottom:
        10px;

    }

    #timer {

      font-size:
        52px;

      font-weight:
        bold;

      color:
        #4cff3b;

      text-shadow:
        0 0 15px
        rgba(76,255,59,0.8);

    }

    #waitingMessage {

      font-size:
        20px;

      color:
        #ddd;

      margin-top:
        15px;

    }

    #destinationBox {

      display:
        none;

      margin:
        30px auto;

      padding:
        30px 25px;

      border:
        3px solid
        #4cff3b;

      border-radius:
        20px;

      background:
        #0b0b0b;

      box-shadow:
        0 0 35px
        rgba(76,255,59,0.5);

      animation:
        reveal 1s ease;

    }

    #destination {

      font-size:
        30px;

      font-weight:
        bold;

      color:
        #4cff3b;

      line-height:
        1.5;

    }

    .destinationTitle {

      font-size:
        20px;

      color:
        white;

      margin-bottom:
        15px;

    }

    @keyframes reveal {

      from {

        opacity:
          0;

        transform:
          scale(0.8);

      }

      to {

        opacity:
          1;

        transform:
          scale(1);

      }

    }

    canvas {

      display:
        none;

    }

  </style>

</head>


<body>


<!-- ====================================================== -->
<!-- SCANNER PAGE -->
<!-- ====================================================== -->

<div id="scannerPage">

  <h1>
    🎂 Birthday Surprise
  </h1>

  <p class="subtitle">
    Point your camera at the QR code.
  </p>

  <p class="subtitle">
    Your surprise will appear automatically.
  </p>


  <div class="cameraBox">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <canvas id="canvas"></canvas>


  <div id="status">
    Camera not started.
  </div>


  <button
    id="startButton"
    onclick="startScanner()">

    📷 Start Scanner

  </button>

</div>


<!-- ====================================================== -->
<!-- RESULT PAGE -->
<!-- ====================================================== -->

<div id="resultPage">

  <h1>
    🎂 Birthday Surprise
  </h1>


  <div class="successTitle">

    🎉 CLUE
    <span id="scanNumberDisplay"></span>
    FOUND!

  </div>


  <div class="clueCard">

    <div class="clueLabel">
      Your clue
    </div>

    <div id="clueText">
      Loading...
    </div>

  </div>


  <!-- ================================================== -->
  <!-- TIMER -->
  <!-- ================================================== -->

  <div
    class="timerBox"
    id="timerBox">

    <div class="timerLabel">

      🔐 Your destination will be revealed in

    </div>


    <div id="timer">
      02:30
    </div>


    <div id="waitingMessage">

      Keep this screen open...

    </div>

  </div>


  <!-- ================================================== -->
  <!-- DESTINATION -->
  <!-- ================================================== -->

  <div
    id="destinationBox">

    <div class="destinationTitle">

      🎁 The next destination is:

    </div>


    <div id="destination">

    </div>

  </div>

</div>


<script>


// ============================================================
// CONFIGURATION
// ============================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyar5ETPG9fs8Rur7aYuR9wZDFF9ry8Ra9Fw3wbz97AsYUrnK12BpLQofuHCsUFpWrw/exec";


// ============================================================
// ELEMENTS
// ============================================================

const video =
  document.getElementById(
    "camera"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently:
        true
    }
  );


const status =
  document.getElementById(
    "status"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const scannerPage =
  document.getElementById(
    "scannerPage"
  );


const resultPage =
  document.getElementById(
    "resultPage"
  );


const clueText =
  document.getElementById(
    "clueText"
  );


const destination =
  document.getElementById(
    "destination"
  );


const destinationBox =
  document.getElementById(
    "destinationBox"
  );


const timer =
  document.getElementById(
    "timer"
  );


const timerBox =
  document.getElementById(
    "timerBox"
  );


const waitingMessage =
  document.getElementById(
    "waitingMessage"
  );


const scanNumberDisplay =
  document.getElementById(
    "scanNumberDisplay"
  );


// ============================================================
// VARIABLES
// ============================================================

let stream =
  null;

let scanning =
  false;

let timerInterval =
  null;


// ============================================================
// START SCANNER
// ============================================================

async function startScanner() {

  startButton.disabled =
    true;

  status.innerHTML =
    "📷 Requesting camera permission...";


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera is not supported by this browser."
      );

    }


    // --------------------------------------------------------
    // STOP OLD CAMERA
    // --------------------------------------------------------

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    // --------------------------------------------------------
    // START REAR CAMERA
    // --------------------------------------------------------

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal:
              "environment"
          },

          width: {
            ideal:
              1280
          },

          height: {
            ideal:
              720
          }

        },

        audio:
          false

      });


    video.srcObject =
      stream;


    await video.play();


    status.innerHTML =
      "📷 Camera working — scanning QR code...";


    scanning =
      true;


    scanQRCode();


  } catch (error) {

    console.error(
      error
    );


    status.innerHTML =
      "❌ Camera error: " +
      error.message;


    startButton.disabled =
      false;

  }

}


// ============================================================
// QR SCANNER
// ============================================================

function scanQRCode() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    if (
      canvas.width > 0 &&
      canvas.height > 0
    ) {

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (code) {

        console.log(
          "QR DETECTED:",
          code.data
        );


        scanning =
          false;


        stopCamera();


        processQRCode(
          code.data
        );


        return;

      }

    }

  }


  requestAnimationFrame(
    scanQRCode
  );

}


// ============================================================
// STOP CAMERA
// ============================================================

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream =
      null;

  }


  video.srcObject =
    null;

}


// ============================================================
// PROCESS QR CONTENT
// ============================================================

function processQRCode(
  qrData
) {

  console.log(
    "QR CONTENT:",
    qrData
  );


  let scanNumber =
    null;


  try {

    const url =
      new URL(
        qrData
      );


    scanNumber =
      url.searchParams.get(
        "scan"
      );


  } catch (error) {

    console.log(
      "QR is not a normal URL."
    );

  }


  // ----------------------------------------------------------
  // FALLBACK
  // ----------------------------------------------------------

  if (!scanNumber) {

    const match =
      String(qrData).match(
        /[?&]scan=([^&]+)/i
      );


    if (match) {

      scanNumber =
        decodeURIComponent(
          match[1]
        );

    }

  }


  // ----------------------------------------------------------
  // VALIDATION
  // ----------------------------------------------------------

  if (!scanNumber) {

    status.innerHTML =
      "❌ This QR code does not contain a valid clue number.";

    startButton.disabled =
      false;

    return;

  }


  // ----------------------------------------------------------
  // OPEN RESULT
  // ----------------------------------------------------------

  openResultPage(
    scanNumber
  );

}


// ============================================================
// OPEN RESULT PAGE
// ============================================================

function openResultPage(
  scanNumber
) {

  scannerPage.style.display =
    "none";


  resultPage.style.display =
    "block";


  scanNumberDisplay.innerHTML =
    escapeHtml(
      scanNumber
    );


  clueText.innerHTML =
    "🔍 Loading your surprise...";


  destinationBox.style.display =
    "none";


  timerBox.style.display =
    "block";


  waitingMessage.innerHTML =
    "Keep this screen open...";


  timer.innerHTML =
    "02:30";


  // ----------------------------------------------------------
  // CHANGE BROWSER URL
  // ----------------------------------------------------------

  const newUrl =
    window.location.pathname +
    "?result=1&scan=" +
    encodeURIComponent(
      scanNumber
    );


  window.history.pushState(
    {
      result:
        true,

      scan:
        scanNumber

    },
    "",
    newUrl
  );


  // ----------------------------------------------------------
  // LOAD CLUE
  // ----------------------------------------------------------

  getClueFromAppsScript(
    scanNumber
  );

}


// ============================================================
// GET CLUE FROM APPS SCRIPT
// ============================================================

function getClueFromAppsScript(
  scanNumber
) {

  status.innerHTML =
    "🔍 Loading clue " +
    escapeHtml(
      scanNumber
    ) +
    "...";


  const callbackName =
    "qrCallback_" +
    Date.now();


  let scriptElement =
    null;


  // ----------------------------------------------------------
  // JSONP CALLBACK
  // ----------------------------------------------------------

  window[callbackName] =
    function(data) {

      console.log(
        "APPS SCRIPT RESPONSE:",
        data
      );


      try {

        delete window[
          callbackName
        ];

      } catch (e) {

        window[
          callbackName
        ] = undefined;

      }


      if (scriptElement) {

        scriptElement.remove();

      }


      // ------------------------------------------------------
      // ERROR RESPONSE
      // ------------------------------------------------------

      if (
        !data ||
        data.success !== true
      ) {

        clueText.innerHTML =
          "❌ Could not load your surprise.<br><br>" +

          escapeHtml(
            data &&
            data.error
              ? data.error
              : "Unknown error."
          );


        return;

      }


      // ------------------------------------------------------
      // SUCCESS
      // ------------------------------------------------------

      console.log(
        "CLUE RECEIVED:",
        data
      );


      clueText.innerHTML =
        escapeHtml(
          data.clue || ""
        );


      // ------------------------------------------------------
      // START 2:30 TIMER
      // ------------------------------------------------------

      startCountdown(
        data.destination || ""
      );

    };


  // ----------------------------------------------------------
  // API URL
  // ----------------------------------------------------------

  const apiUrl =
    APPS_SCRIPT_URL +
    "?api=1" +
    "&scan=" +
    encodeURIComponent(
      scanNumber
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "API URL:",
    apiUrl
  );


  // ----------------------------------------------------------
  // CREATE SCRIPT
  // ----------------------------------------------------------

  scriptElement =
    document.createElement(
      "script"
    );


  scriptElement.src =
    apiUrl;


  // ----------------------------------------------------------
  // NETWORK ERROR
  // ----------------------------------------------------------

  scriptElement.onerror =
    function() {

      console.error(
        "Apps Script JSONP request failed."
      );


      try {

        delete window[
          callbackName
        ];

      } catch (e) {

        window[
          callbackName
        ] = undefined;

      }


      clueText.innerHTML =
        "❌ Could not connect to the clue server.<br><br>" +

        "Please check your Apps Script deployment.";


      scriptElement.remove();

    };


  document.body.appendChild(
    scriptElement
  );

}


// ============================================================
// 2 MINUTES 30 SECONDS COUNTDOWN
// ============================================================

function startCountdown(
  destinationValue
) {

  // ----------------------------------------------------------
  // STOP OLD TIMER
  // ----------------------------------------------------------

  if (timerInterval) {

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;

  }


  // ----------------------------------------------------------
  // 150 SECONDS = 2 MINUTES 30 SECONDS
  // ----------------------------------------------------------

  const TOTAL_SECONDS =
    150;


  let remaining =
    TOTAL_SECONDS;


  timerBox.style.display =
    "block";


  destinationBox.style.display =
    "none";


  waitingMessage.innerHTML =
    "Keep this screen open...";


  updateTimer(
    remaining
  );


  // ----------------------------------------------------------
  // COUNTDOWN
  // ----------------------------------------------------------

  timerInterval =
    setInterval(
      function() {

        remaining--;


        updateTimer(
          remaining
        );


        if (
          remaining <= 0
        ) {

          clearInterval(
            timerInterval
          );


          timerInterval =
            null;


          timer.innerHTML =
            "00:00";


          revealDestination(
            destinationValue
          );

        }

      },
      1000
    );

}


// ============================================================
// UPDATE TIMER
// ============================================================

function updateTimer(
  seconds
) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  timer.innerHTML =
    String(minutes)
      .padStart(
        2,
        "0"
      ) +

    ":" +

    String(secs)
      .padStart(
        2,
        "0"
      );

}


// ============================================================
// REVEAL DESTINATION
// ============================================================

function revealDestination(
  value
) {

  waitingMessage.innerHTML =
    "🎉 The wait is over!";


  if (
    value &&
    String(value).trim()
  ) {

    destination.innerHTML =
      escapeHtml(
        value
      );

  } else {

    destination.innerHTML =
      "Your next surprise is waiting for you! 🎁";

  }


  destinationBox.style.display =
    "block";

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// ============================================================
// OPEN EXISTING RESULT
// ============================================================

(function checkExistingResult() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const result =
    params.get(
      "result"
    );


  const scan =
    params.get(
      "scan"
    );


  if (
    result === "1" &&
    scan
  ) {

    openResultPage(
      scan
    );

  }

})();

</script>

</body>

</html>
