<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Birthday Hunt</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 25px 10px 10px;
      color: #4cff3b;
      font-size: 42px;
    }

    p {
      font-size: 20px;
    }

    #cameraBox {
      width: 90%;
      max-width: 650px;
      margin: 35px auto 20px;
      border: 4px solid #4cff3b;
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
      background: #111;
    }

    #camera {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      background: #111;
    }

    canvas {
      display: none;
    }

    #status {
      font-size: 22px;
      margin: 25px 10px;
    }

    #result {
      width: 90%;
      max-width: 650px;
      margin: 20px auto;
      padding: 25px;
      box-sizing: border-box;
      border-radius: 15px;
      border: 3px solid #4cff3b;
      background: #111;
      display: none;
    }

    #result h2 {
      color: #4cff3b;
      font-size: 28px;
    }

    #clueText {
      font-size: 24px;
      line-height: 1.6;
      margin: 25px 0;
      color: white;
      white-space: pre-wrap;
    }

    #destination {
      font-size: 21px;
      line-height: 1.5;
      color: #4cff3b;
      margin-top: 20px;
    }

    #detected {
      font-size: 14px;
      color: #aaa;
      word-break: break-all;
      margin-top: 20px;
    }

    button {
      padding: 16px 30px;
      font-size: 20px;
      font-weight: bold;
      border: 3px solid #4cff3b;
      border-radius: 12px;
      background: #111;
      color: #4cff3b;
      margin: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

  </style>
</head>

<body>

  <h1>🎂 Birthday Hunt</h1>

  <p>Point your camera at the QR code.</p>

  <p>The clue will appear automatically.</p>


  <div id="cameraBox">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <canvas id="canvas"></canvas>


  <div id="status">
    Camera not started.
  </div>


  <div id="result">

    <h2 id="clueHeading">
      🎉 CLUE FOUND!
    </h2>

    <div id="clueText"></div>

    <div id="destination"></div>

    <div id="detected"></div>

  </div>


  <button
    id="startButton"
    onclick="startScanner()">
    📷 Start Scanner
  </button>


  <button
    id="retryButton"
    onclick="startScanner()"
    style="display:none;">
    🔄 Scan Again
  </button>


<script>


// ============================================================
// APPS SCRIPT WEB APP URL
// ============================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyar5ETPG9fs8Rur7aYuR9wZDFF9ry8Ra9Fw3wbz97AsYUrnK12BpLQofuHCsUFpWrw/exec";


// ============================================================
// ELEMENTS
// ============================================================

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d", {
    willReadFrequently: true
  });

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const clueText =
  document.getElementById("clueText");

const destination =
  document.getElementById("destination");

const detected =
  document.getElementById("detected");

const startButton =
  document.getElementById("startButton");

const retryButton =
  document.getElementById("retryButton");


// ============================================================
// VARIABLES
// ============================================================

let stream = null;

let scanning = false;

let alreadyDetected = false;


// ============================================================
// START SCANNER
// ============================================================

async function startScanner() {

  alreadyDetected = false;

  result.style.display = "none";

  retryButton.style.display = "none";

  startButton.disabled = true;

  status.innerHTML =
    "📷 Requesting camera permission...";


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera is not supported by this browser."
      );

    }


    // Stop previous camera

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }


    // Open rear camera

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    status.innerHTML =
      "📷 Camera working — scanning QR code...";


    scanning = true;

    scanQRCode();


  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Camera error: " +
      error.name +
      " — " +
      error.message;

    startButton.disabled = false;

  }

}


// ============================================================
// QR SCANNER
// ============================================================

function scanQRCode() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts: "attemptBoth"
        }
      );


    if (code) {

      handleQRCode(code.data);

      return;

    }

  }


  requestAnimationFrame(
    scanQRCode
  );

}


// ============================================================
// HANDLE QR CODE
// ============================================================

function handleQRCode(qrContent) {

  if (alreadyDetected) {
    return;
  }

  alreadyDetected = true;

  scanning = false;


  // Stop camera

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

  }

  video.srcObject = null;


  console.log(
    "QR CODE FOUND:",
    qrContent
  );


  detected.innerHTML =
    "Detected:<br>" +
    escapeHtml(qrContent);


  // ==========================================================
  // EXTRACT scan NUMBER FROM QR URL
  // ==========================================================

  let scanNumber = "";


  try {

    const qrUrl =
      new URL(qrContent);


    scanNumber =
      qrUrl.searchParams.get("scan") || "";

  } catch (error) {

    console.error(
      "QR is not a valid URL:",
      error
    );

  }


  // ==========================================================
  // CHECK scan NUMBER
  // ==========================================================

  if (!scanNumber) {

    status.innerHTML =
      "❌ QR code detected, but no scan number was found.";

    clueText.innerHTML =
      "The QR code must contain something like:<br><br>" +
      "?scan=1";

    destination.innerHTML = "";

    result.style.display = "block";

    startButton.disabled = false;

    retryButton.style.display =
      "inline-block";

    return;

  }


  // ==========================================================
  // LOAD CLUE
  // ==========================================================

  getClueFromAppsScript(
    scanNumber
  );

}


// ============================================================
// GET CLUE FROM GOOGLE APPS SCRIPT
// ============================================================

function getClueFromAppsScript(
  scanNumber
) {

  status.innerHTML =
    "🔍 Loading clue " +
    escapeHtml(scanNumber) +
    "...";


  result.style.display = "none";


  const callbackName =
    "qrCallback_" +
    Date.now();


  let scriptElement = null;


  // ==========================================================
  // JSONP CALLBACK
  // ==========================================================

  window[callbackName] =
    function(data) {

      console.log(
        "APPS SCRIPT RESPONSE:",
        data
      );


      try {

        delete window[callbackName];

      } catch (e) {

        window[callbackName] =
          undefined;

      }


      if (scriptElement) {
        scriptElement.remove();
      }


      // ======================================================
      // ERROR
      // ======================================================

      if (
        !data ||
        data.success !== true
      ) {

        status.innerHTML =
          "❌ Could not load the clue.";


        clueText.innerHTML =
          escapeHtml(
            data && data.error
              ? data.error
              : "Unknown error."
          );


        destination.innerHTML = "";

        result.style.display =
          "block";


        startButton.disabled =
          false;


        retryButton.style.display =
          "inline-block";


        return;

      }


      // ======================================================
      // SUCCESS
      // ======================================================

      status.innerHTML =
        "🎉 CLUE " +
        escapeHtml(data.scan) +
        " FOUND!";


      clueText.innerHTML =
        escapeHtml(
          data.clue || ""
        );


      if (data.destination) {

        destination.innerHTML =
          "<strong>📍 Go to:</strong><br>" +
          escapeHtml(
            data.destination
          );

      } else {

        destination.innerHTML = "";

      }


      result.style.display =
        "block";


      startButton.disabled =
        false;


      retryButton.style.display =
        "inline-block";

    };


  // ==========================================================
  // APPS SCRIPT API URL
  // ==========================================================

  const apiUrl =
    APPS_SCRIPT_URL +
    "?api=1" +
    "&scan=" +
    encodeURIComponent(scanNumber) +
    "&callback=" +
    encodeURIComponent(callbackName);


  console.log(
    "API URL:",
    apiUrl
  );


  // ==========================================================
  // CREATE JSONP SCRIPT
  // ==========================================================

  scriptElement =
    document.createElement("script");


  scriptElement.src =
    apiUrl;


  scriptElement.onerror =
    function() {

      console.error(
        "Apps Script API failed."
      );


      try {

        delete window[callbackName];

      } catch (e) {

        window[callbackName] =
          undefined;

      }


      status.innerHTML =
        "❌ Could not connect to the clue server.";


      clueText.innerHTML =
        "Please check the Apps Script deployment.";


      destination.innerHTML = "";

      result.style.display =
        "block";


      startButton.disabled =
        false;


      retryButton.style.display =
        "inline-block";


      scriptElement.remove();

    };


  document.body.appendChild(
    scriptElement
  );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


</script>

</body>
</html>
