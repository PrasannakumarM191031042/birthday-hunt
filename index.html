<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>QR Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 25px 10px 10px;
      color: #4cff3b;
    }

    p {
      font-size: 18px;
    }

    #camera {
      width: 90%;
      max-width: 600px;
      height: auto;
      margin: 20px auto;
      border: 3px solid #4cff3b;
      border-radius: 15px;
      background: #111;
      display: block;
    }

    #status {
      font-size: 18px;
      margin: 20px;
    }

    #result {
      font-size: 18px;
      color: #4cff3b;
      font-weight: bold;
      margin: 20px;
      padding: 15px;
      word-break: break-all;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid #4cff3b;
      border-radius: 10px;
      background: #111;
      color: #4cff3b;
      margin: 15px;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<h1>📷 QR SCANNER</h1>

<p>Use your mobile phone camera to scan the QR code.</p>

<p><b>Hold the QR code inside the scanning box.</b></p>

<p style="color:#4cff3b;">
  No picture is taken or uploaded.
</p>

<video
  id="camera"
  autoplay
  playsinline
  muted>
</video>

<canvas id="canvas"></canvas>

<div id="status">
  Camera not started.
</div>

<div id="result"></div>

<button id="startButton" onclick="startScanner()">
  📷 Start Scanner
</button>

<script>

let video = document.getElementById("camera");
let canvas = document.getElementById("canvas");

let ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

let stream = null;
let scanning = false;
let qrAlreadyFound = false;


/* =========================
   START CAMERA
========================= */

async function startScanner() {

  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const button = document.getElementById("startButton");

  result.innerHTML = "";

  qrAlreadyFound = false;

  status.innerHTML = "Requesting camera permission...";

  button.disabled = true;

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      status.innerHTML =
        "❌ Camera is not supported.";

      button.disabled = false;

      return;
    }


    /* Stop old camera */

    if (stream) {

      stream.getTracks().forEach(
        track => track.stop()
      );

    }


    /* Start rear camera */

    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }
      },

      audio: false

    });


    video.srcObject = stream;

    await video.play();


    status.innerHTML =
      "🟢 Camera working — scanning...";

    scanning = true;

    scanQRCode();

  }

  catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Camera error: " +
      error.name +
      " — " +
      error.message;

    button.disabled = false;

  }

}


/* =========================
   QR SCANNER
========================= */

function scanQRCode() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code = jsQR(

      imageData.data,

      imageData.width,

      imageData.height,

      {
        inversionAttempts: "attemptBoth"
      }

    );


    /* =========================
       QR FOUND
    ========================= */

    if (
      code &&
      code.data &&
      !qrAlreadyFound
    ) {

      qrAlreadyFound = true;

      scanning = false;


      console.log(
        "QR CODE FOUND:",
        code.data
      );


      /* Stop camera */

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

      }

      video.srcObject = null;


      /* Show result */

      document.getElementById("status").innerHTML =
        "✅ QR CODE DETECTED!";


      document.getElementById("result").innerHTML =
        "<div>QR CONTENT:</div>" +
        "<br>" +
        "<div>" +
        escapeHtml(code.data) +
        "</div>";


      document.getElementById("startButton")
        .disabled = false;


      /*
        IMPORTANT:

        DO NOT use:

        window.location.href = code.data

        DO NOT use:

        window.open(code.data)

        DO NOT use:

        location.assign(code.data)

        Therefore the page will NOT
        navigate to Google Apps Script.
      */


      return;
    }

  }


  /* Continue scanning */

  requestAnimationFrame(
    scanQRCode
  );

}


/* =========================
   SAFELY DISPLAY QR CONTENT
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
