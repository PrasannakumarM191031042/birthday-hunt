<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>QR Scanner</title>

  <!-- QR scanner library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 25px 10px 10px;
      color: #4cff3b;
    }

    p {
      font-size: 18px;
    }

    #camera {
      width: 90%;
      max-width: 600px;
      height: auto;
      margin: 20px auto;
      border: 3px solid #4cff3b;
      border-radius: 15px;
      background: #111;
      display: block;
    }

    #status {
      font-size: 18px;
      margin: 20px;
    }

    #result {
      font-size: 20px;
      color: #4cff3b;
      font-weight: bold;
      margin: 20px;
      word-break: break-word;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid #4cff3b;
      border-radius: 10px;
      background: #111;
      color: #4cff3b;
      margin: 15px;
    }

    button:disabled {
      opacity: 0.5;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h1>📷 QR Scanner</h1>

  <p>
    Point your camera at the QR code.
  </p>

  <p>
    No picture is taken or uploaded.
  </p>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="canvas"></canvas>

  <div id="status">
    Camera not started.
  </div>

  <div id="result"></div>

  <button id="startButton" onclick="startScanner()">
    📷 Start Scanner
  </button>

<script>

let video = document.getElementById("camera");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

let stream = null;
let scanning = false;

async function startScanner() {

  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const button = document.getElementById("startButton");

  result.innerHTML = "";

  status.innerHTML = "Requesting camera permission...";

  button.disabled = true;

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      status.innerHTML =
        "❌ Camera is not supported by this browser.";

      button.disabled = false;

      return;
    }

    // Stop previous camera if one exists
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    // Open rear camera
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    status.innerHTML =
      "📷 Camera working — scanning QR code...";

    scanning = true;

    scanQRCode();

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Camera error: " +
      error.name +
      " — " +
      error.message;

    button.disabled = false;
  }
}


function scanQRCode() {

  if (!scanning) {
    return;
  }

  // Make sure video has actual dimensions
  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const imageData = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const code = jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts: "attemptBoth"
      }
    );

    if (code) {

      console.log("QR CODE FOUND:", code.data);

      scanning = false;

      // Stop camera
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      video.srcObject = null;

      status.innerHTML =
        "✅ QR CODE DETECTED!";

      result.innerHTML =
        "QR Result:<br>" +
        code.data;

      document.getElementById("startButton").disabled = false;

      return;
    }
  }

  // Continue scanning
  requestAnimationFrame(scanQRCode);
}

</script>

</body>
</html>
