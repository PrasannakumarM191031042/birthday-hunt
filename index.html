<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Birthday Surprise</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- COMMON CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- PINK THEME -->
  <link rel="stylesheet" href="themes/pink.css">

</head>


<body>


  <!-- ======================================================
       CELEBRATION STREAMERS
       ====================================================== -->

  <div class="celebration">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  </div>


  <!-- ======================================================
       SCANNER PAGE
       ====================================================== -->

  <div id="scannerPage">

    <h1>
      🎂 Birthday Surprise
    </h1>

    <p class="subtitle">
      Point your camera at the QR code.
    </p>

    <p class="subtitle">
      Your surprise will appear automatically.
    </p>


    <div class="cameraBox">

      <video
        id="camera"
        autoplay
        playsinline
        muted>
      </video>

    </div>


    <canvas id="canvas"></canvas>


    <div id="status">
      Camera not started.
    </div>


    <button
      id="startButton"
      onclick="startScanner()">

      📷 Start Scanner

    </button>

  </div>


  <!-- ======================================================
       RESULT PAGE
       ====================================================== -->

  <div id="resultPage">

    <h1>
      🎂 Birthday Surprise
    </h1>


    <div class="successTitle">

      🎉 CLUE
      <span id="scanNumberDisplay"></span>
      FOUND!

    </div>


    <div class="clueCard">

      <div class="clueLabel">
        Your clue
      </div>

      <div id="clueText">
        Loading...
      </div>

    </div>


    <!-- ====================================================
         TIMER
         ==================================================== -->

    <div
      class="timerBox"
      id="timerBox">

      <div class="timerLabel">

        🔐 Your destination will be revealed in

      </div>


      <div id="timer">
        02:30
      </div>


      <div id="waitingMessage">

        Keep this screen open...

      </div>

    </div>


    <!-- ====================================================
         DESTINATION
         ==================================================== -->

    <div id="destinationBox">

      <div class="destinationTitle">

        🎁 The next destination is:

      </div>


      <div id="destination">

      </div>

    </div>

  </div>



<script>


// ============================================================
// CONFIGURATION
// ============================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyar5ETPG9fs8Rur7aYuR9wZDFF9ry8Ra9Fw3wbz97AsYUrnK12BpLQofuHCsUFpWrw/exec";


// ============================================================
// ELEMENTS
// ============================================================

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const scannerPage =
  document.getElementById("scannerPage");

const resultPage =
  document.getElementById("resultPage");

const clueText =
  document.getElementById("clueText");

const destination =
  document.getElementById("destination");

const destinationBox =
  document.getElementById("destinationBox");

const timer =
  document.getElementById("timer");

const scanNumberDisplay =
  document.getElementById("scanNumberDisplay");

const timerBox =
  document.getElementById("timerBox");


// ============================================================
// VARIABLES
// ============================================================

let stream = null;

let scanning = false;

let timerInterval = null;


// ============================================================
// START SCANNER
// ============================================================

async function startScanner() {

  startButton.disabled = true;

  status.innerHTML =
    "📷 Requesting camera permission...";


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera is not supported by this browser."
      );

    }


    // Stop old stream

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    // Start rear camera

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject = stream;


    await video.play();


    status.innerHTML =
      "📷 Camera working — scanning QR code...";


    scanning = true;


    scanQRCode();


  } catch (error) {

    console.error(error);


    status.innerHTML =
      "❌ Camera error: " +
      error.message;


    startButton.disabled = false;

  }

}


// ============================================================
// QR SCANNER
// ============================================================

function scanQRCode() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (code) {

      console.log(
        "QR DETECTED:",
        code.data
      );


      scanning = false;


      stopCamera();


      processQRCode(
        code.data
      );


      return;

    }

  }


  requestAnimationFrame(
    scanQRCode
  );

}


// ============================================================
// STOP CAMERA
// ============================================================

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;

  }


  video.srcObject = null;

}


// ============================================================
// PROCESS QR CONTENT
// ============================================================

function processQRCode(qrData) {

  console.log(
    "QR CONTENT:",
    qrData
  );


  let scanNumber = null;


  try {

    const url =
      new URL(qrData);


    scanNumber =
      url.searchParams.get("scan");


  } catch (error) {

    console.log(
      "QR is not a normal URL."
    );

  }


  // If QR directly contains scan number

  if (!scanNumber) {

    const match =
      String(qrData).match(
        /[?&]scan=([^&]+)/i
      );


    if (match) {

      scanNumber =
        decodeURIComponent(
          match[1]
        );

    }

  }


  if (!scanNumber) {

    status.innerHTML =
      "❌ This QR code does not contain a valid clue number.";

    startButton.disabled = false;

    return;

  }


  openResultPage(
    scanNumber
  );

}


// ============================================================
// OPEN RESULT PAGE
// ============================================================

function openResultPage(scanNumber) {

  scannerPage.style.display =
    "none";

  resultPage.style.display =
    "block";


  scanNumberDisplay.innerHTML =
    escapeHtml(scanNumber);


  clueText.innerHTML =
    "🔍 Loading your surprise...";


  destinationBox.style.display =
    "none";


  timer.innerHTML =
    "02:30";


  // Make URL look like a result page

  const newUrl =
    window.location.pathname +
    "?result=1&scan=" +
    encodeURIComponent(
      scanNumber
    );


  window.history.pushState(
    {
      result: true,
      scan: scanNumber
    },
    "",
    newUrl
  );


  getClueFromAppsScript(
    scanNumber
  );

}


// ============================================================
// GET CLUE FROM APPS SCRIPT
// ============================================================

function getClueFromAppsScript(scanNumber) {

  status.innerHTML =
    "🔍 Loading clue " +
    escapeHtml(scanNumber) +
    "...";


  const callbackName =
    "qrCallback_" +
    Date.now();


  let scriptElement = null;


  window[callbackName] =
    function(data) {

      console.log(
        "APPS SCRIPT RESPONSE:",
        data
      );


      try {

        delete window[callbackName];

      } catch (e) {

        window[callbackName] =
          undefined;

      }


      if (scriptElement) {

        scriptElement.remove();

      }


      // ERROR

      if (
        !data ||
        data.success !== true
      ) {

        clueText.innerHTML =
          "❌ Could not load your surprise.<br><br>" +

          escapeHtml(
            data &&
            data.error
              ? data.error
              : "Unknown error."
          );

        return;

      }


      // SUCCESS

      console.log(
        "CLUE RECEIVED:",
        data
      );


      clueText.innerHTML =
        escapeHtml(
          data.clue || ""
        );


      startCountdown(
        data.destination || ""
      );

    };


  // API URL

  const apiUrl =
    APPS_SCRIPT_URL +
    "?api=1" +
    "&scan=" +
    encodeURIComponent(scanNumber) +
    "&callback=" +
    encodeURIComponent(callbackName);


  console.log(
    "API URL:",
    apiUrl
  );


  scriptElement =
    document.createElement(
      "script"
    );


  scriptElement.src =
    apiUrl;


  scriptElement.onerror =
    function() {

      console.error(
        "Apps Script API failed."
      );


      try {

        delete window[callbackName];

      } catch (e) {

        window[callbackName] =
          undefined;

      }


      clueText.innerHTML =
        "❌ Could not connect to the clue server.<br><br>" +

        "Please check your Apps Script deployment.";


      scriptElement.remove();

    };


  document.body.appendChild(
    scriptElement
  );

}


// ============================================================
// COUNTDOWN - 2 MINUTES 30 SECONDS
// ============================================================

function startCountdown(destinationValue) {

  if (timerInterval) {

    clearInterval(
      timerInterval
    );

  }


  const TOTAL_SECONDS = 150;

  let remaining =
    TOTAL_SECONDS;


  timerBox.style.display =
    "block";


  destinationBox.style.display =
    "none";


  updateTimer(
    remaining
  );


  timerInterval =
    setInterval(
      function() {

        remaining--;


        updateTimer(
          remaining
        );


        if (
          remaining <= 0
        ) {

          clearInterval(
            timerInterval
          );


          timer.innerHTML =
            "00:00";


          revealDestination(
            destinationValue
          );

        }

      },
      1000
    );

}


// ============================================================
// UPDATE TIMER
// ============================================================

function updateTimer(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  timer.innerHTML =
    String(minutes)
      .padStart(2, "0") +
    ":" +
    String(secs)
      .padStart(2, "0");

}


// ============================================================
// REVEAL DESTINATION
// ============================================================

function revealDestination(value) {

  document.getElementById(
    "waitingMessage"
  ).innerHTML =
    "🎉 The wait is over!";


  if (
    value &&
    String(value).trim()
  ) {

    destination.innerHTML =
      escapeHtml(value);

  } else {

    destination.innerHTML =
      "Your next surprise is waiting for you! 🎁";

  }


  destinationBox.style.display =
    "block";

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// ============================================================
// OPEN RESULT IF URL CONTAINS RESULT
// ============================================================

(function checkExistingResult() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const result =
    params.get("result");


  const scan =
    params.get("scan");


  if (
    result === "1" &&
    scan
  ) {

    openResultPage(
      scan
    );

  }

})();


</script>


</body>

</html>
