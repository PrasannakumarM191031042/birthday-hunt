<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>QR Scanner</title>

  <!-- QR decoding library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 25px 10px 10px;
      color: #4cff3b;
      font-size: 34px;
      text-shadow: 0 0 15px #4cff3b;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
      margin: 8px 15px;
    }

    .scanner-box {
      width: 92%;
      max-width: 700px;
      margin: 25px auto;
      position: relative;
      border: 3px solid #4cff3b;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 25px rgba(76,255,59,0.5);
    }

    #camera {
      width: 100%;
      display: block;
      background: #000;
      min-height: 300px;
      object-fit: cover;
    }

    /* Scanning frame */
    .scan-frame {
      position: absolute;
      width: 65%;
      height: 65%;
      left: 17.5%;
      top: 17.5%;
      border: 3px solid #4cff3b;
      border-radius: 12px;
      box-shadow:
        0 0 15px #4cff3b,
        inset 0 0 15px rgba(76,255,59,0.3);
      pointer-events: none;
    }

    /* Animated scanning line */
    .scan-line {
      position: absolute;
      left: 18%;
      width: 64%;
      height: 3px;
      background: #4cff3b;
      box-shadow: 0 0 12px #4cff3b;
      animation: scan 2s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% {
        top: 18%;
      }

      50% {
        top: 80%;
      }

      100% {
        top: 18%;
      }
    }

    #status {
      margin: 20px;
      font-size: 19px;
      font-weight: bold;
    }

    .ready {
      color: #4cff3b;
    }

    .error {
      color: #ff4444;
    }

    .success {
      color: #4cff3b;
      font-size: 22px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid #4cff3b;
      border-radius: 10px;
      background: #111;
      color: #4cff3b;
      margin: 15px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(76,255,59,0.4);
    }

    button:active {
      transform: scale(0.96);
    }

    #result {
      width: 90%;
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #111;
      word-break: break-all;
      display: none;
    }

    #canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h1>📷 QR SCANNER</h1>

  <p>
    Use your mobile phone camera to scan the QR code.
  </p>

  <p>
    <b>Hold the QR code inside the scanning box.</b>
  </p>

  <p style="color:#4cff3b;">
    No picture is taken or uploaded.
  </p>

  <div class="scanner-box">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

    <div class="scan-frame"></div>
    <div class="scan-line"></div>

  </div>

  <canvas id="canvas"></canvas>

  <div id="status">
    <span class="ready">🟢 Starting camera...</span>
  </div>

  <button id="startButton" onclick="startScanner()">
    📷 Start Scanner
  </button>

  <div id="result"></div>


<script>

let video = document.getElementById("camera");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

let stream = null;
let scanning = false;
let found = false;


/* ==========================================
   START SCANNER
   ========================================== */

async function startScanner() {

  const status = document.getElementById("status");
  const button = document.getElementById("startButton");

  if (scanning) {
    return;
  }

  found = false;

  status.innerHTML =
    '<span class="ready">🟡 Requesting camera...</span>';

  try {

    /* Stop previous camera */
    if (stream) {

      stream.getTracks().forEach(function(track) {
        track.stop();
      });

      stream = null;
    }


    /* Check camera support */
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "Camera access is not supported by this browser."
      );
    }


    /*
     * Rear camera preferred.
     */
    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }
      },

      audio: false
    });


    video.srcObject = stream;


    /*
     * Wait until camera has dimensions.
     */
    await new Promise(function(resolve) {

      if (video.readyState >= 2) {
        resolve();
        return;
      }

      video.onloadedmetadata = function() {
        resolve();
      };

    });


    await video.play();


    scanning = true;

    button.innerHTML = "🔄 Scanner Running";

    status.innerHTML =
      '<span class="ready">🟢 CAMERA READY — Looking for QR code...</span>';


    /*
     * Start continuous QR scanning.
     */
    requestAnimationFrame(scanFrame);


  } catch (error) {

    console.error(error);

    scanning = false;

    let message = error.message;

    if (error.name === "NotAllowedError") {

      message =
        "Camera permission was denied. Please allow Camera access for this site in your browser settings.";

    } else if (error.name === "NotFoundError") {

      message =
        "No camera was found on this device.";

    } else if (error.name === "NotReadableError") {

      message =
        "Camera is being used by another application.";

    }

    status.innerHTML =
      '<span class="error">❌ ' +
      message +
      '</span>';

  }

}


/* ==========================================
   QR SCANNING
   ========================================== */

function scanFrame() {

  if (!scanning || found) {
    return;
  }


  /*
   * Make sure camera is actually producing frames.
   */
  if (video.readyState !== video.HAVE_ENOUGH_DATA) {

    requestAnimationFrame(scanFrame);

    return;
  }


  const width = video.videoWidth;
  const height = video.videoHeight;


  if (!width || !height) {

    requestAnimationFrame(scanFrame);

    return;
  }


  /*
   * Use the actual camera resolution.
   */
  canvas.width = width;
  canvas.height = height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
   * Read pixels from camera.
   */
  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  /*
   * Decode QR code.
   */
  if (typeof jsQR === "function") {

    const code = jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts: "attemptBoth"
      }
    );


    if (code) {

      handleQRCode(code.data);

      return;
    }

  } else {

    document.getElementById("status").innerHTML =
      '<span class="error">❌ QR decoder could not load. Check internet connection.</span>';

  }


  /*
   * Continue scanning.
   */
  requestAnimationFrame(scanFrame);
}


/* ==========================================
   QR FOUND
   ========================================== */

function handleQRCode(data) {

  if (found) {
    return;
  }

  found = true;
  scanning = false;


  /*
   * Stop camera.
   */
  if (stream) {

    stream.getTracks().forEach(function(track) {
      track.stop();
    });

    stream = null;
  }


  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");


  status.innerHTML =
    '<span class="success">✅ QR CODE FOUND!</span>';


  result.style.display = "block";

  result.innerHTML =
    "<b>Scanned:</b><br><br>" +
    escapeHtml(data);


  /*
   * If QR contains a URL,
   * automatically open it.
   */
  if (isURL(data)) {

    status.innerHTML =
      '<span class="success">✅ QR CODE FOUND! Opening...</span>';

    setTimeout(function() {

      window.location.href = data;

    }, 800);

  }

}


/* ==========================================
   CHECK URL
   ========================================== */

function isURL(text) {

  try {

    const url = new URL(text);

    return (
      url.protocol === "http:" ||
      url.protocol === "https:"
    );

  } catch (e) {

    return false;

  }

}


/* ==========================================
   HTML ESCAPE
   ========================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* ==========================================
   CLEAN UP CAMERA
   ========================================== */

window.addEventListener(
  "pagehide",
  function() {

    if (stream) {

      stream.getTracks().forEach(function(track) {
        track.stop();
      });

    }

  }
);

</script>

</body>
</html>
